spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tfmsp_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:tfmsp_user}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

app.admin.email=${ADMIN_EMAIL:admin@milan.com}
app.admin.password=${ADMIN_PASSWORD:}

# Show OTP codes in the console (dev / demo only, no email or SMS gateway yet)
app.otp.log-code=${OTP_LOG_CODE:true}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:}